
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新增文章</title>
</head>
<body>
    <h1>新增文章</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('new_post') }}">
        <p>
            <label for="title">標題：</label><br>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ title or '' }}"
                required
            >
        </p>

        <p>
            <label for="author">作者：</label><br>
            <input
                type="text"
                id="author"
                name="author"
                value="{{ author or '' }}"
                required
            >
        </p>

        <p>
            <label for="content">文章內容：</label><br>
            <textarea
                id="content"
                name="content"
                rows="10"
                cols="50"
                required
            >{{ content or '' }}</textarea>
        </p>

        <button type="submit">發表文章</button>
    </form>

    <p>
        <a href="{{ url_for('index') }}">取消並回首頁</a>
    </p>
</body>
</html>
